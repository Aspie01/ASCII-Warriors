name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile all sources
        run: python -m compileall -q ascii_warriors tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Headless smoke run
        run: python -m tools.smoke --seed ci --size pocket --history 20
