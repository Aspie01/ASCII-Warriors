[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-warriors"
version = "3.9.0"
description = "A Dwarf-Fortress-inspired ASCII adventure RPG for Windows and Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["roguelike", "ascii", "rpg", "dwarf-fortress", "terminal", "game"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Aspie01/ASCII-Warriors"
Source = "https://github.com/Aspie01/ASCII-Warriors"

[project.scripts]
ascii-warriors = "ascii_warriors.main:main"

[tool.setuptools.packages.find]
include = ["ascii_warriors*"]

[tool.setuptools.package-data]
ascii_warriors = ["py.typed"]
